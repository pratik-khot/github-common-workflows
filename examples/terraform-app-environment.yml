name: Terraform MyApp Dev

on:
  pull_request:
    paths:
      - myapp/dev/**
      - .github/workflows/terraform-myapp-dev.yml
  push:
    branches: [main]
    paths:
      - myapp/dev/**
  workflow_dispatch:
    inputs:
      terraform-root:
        description: Terraform root to destroy.
        required: false
        default: myapp/dev
        type: string
      action:
        description: Set to "destroy" to tear down the given root.
        required: false
        default: plan
        type: choice
        options:
          - plan
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    uses: YOUR_ORG/github-common-workflows/.github/workflows/terraform-plan.yml@v1
    with:
      root-path: myapp/dev
      aws-region: us-east-1
    secrets: inherit

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: YOUR_ORG/github-common-workflows/.github/workflows/terraform-apply.yml@v1
    with:
      root-path: myapp/dev
      environment: dev
      aws-region: us-east-1
    secrets: inherit

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    uses: YOUR_ORG/github-common-workflows/.github/workflows/terraform-destroy.yml@v1
    with:
      terraform-root: ${{ inputs.terraform-root }}
      environment: dev
      aws-region: us-east-1
      action: destroy
      allow-destroy: true
    secrets: inherit
