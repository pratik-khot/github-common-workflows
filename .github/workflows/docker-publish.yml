name: Docker Publish

on:
  workflow_call:
    inputs:
      context:
        required: false
        default: .
        type: string
      file:
        required: false
        default: Dockerfile
        type: string
      image-name:
        required: true
        type: string
      tags:
        required: true
        type: string
      platforms:
        required: false
        default: linux/amd64,linux/arm64
        type: string
      aws-region:
        required: true
        type: string
      ecr-registry:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
    outputs:
      image-digest:
        value: ${{ jobs.publish.outputs.image-digest }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aws-login
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.ecr-registry }}/${{ inputs.image-name }}:${{ inputs.tags }}