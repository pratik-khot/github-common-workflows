name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        required: false
        default: .
        type: string
      file:
        required: false
        default: Dockerfile
        type: string
      platforms:
        required: false
        default: linux/amd64
        type: string
      image-name:
        required: true
        type: string
      tags:
        required: true
        type: string
      build-args:
        required: false
        default: ""
        type: string
      push:
        required: false
        default: false
        type: boolean
    outputs:
      image-digest:
        description: Digest of the built image when pushed.
        value: ${{ jobs.build.outputs.image-digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image-name }}:${{ inputs.tags }}
          build-args: ${{ inputs.build-args }}