name: Security Scan

on:
  workflow_call:
    inputs:
      root-path:
        description: Optional path prefix to restrict Terraform root detection to, for example myapp.
        required: false
        default: ""
        type: string
      image-reference:
        required: false
        default: ""
        type: string
      scan-terraform:
        required: false
        default: true
        type: boolean
      scan-secrets:
        required: false
        default: true
        type: boolean
      scan-image:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  detect-changes:
    name: Detect changed Terraform roots
    if: inputs.scan-terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.changed.outputs.dirs }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect changed Terraform directories
        uses: ./.github/actions/changed-terraform-dirs
        with:
          root-path: ${{ inputs.root-path }}

  scan-terraform:
    name: Scan ${{ matrix.terraform-root }}
    needs: detect-changes
    if: inputs.scan-terraform && needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        terraform-root: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.terraform-root }}
          framework: terraform

  scan-secrets:
    name: Scan secrets
    if: inputs.scan-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2

  scan-image:
    name: Scan container image
    if: inputs.scan-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-reference }}
          format: sarif
          output: trivy-results.sarif
      - name: Upload container scan
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
