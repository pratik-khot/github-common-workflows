name: Checkov Scan

on:
  workflow_call:
    inputs:
      root-path:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.dirs }}
      has-changes: ${{ steps.changed.outputs.has-changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        uses: pratik-khot/github-common-workflows/.github/actions/changed-terraform-dirs@v1
        with:
          root-path: ${{ inputs.root-path }}

  checkov:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        terraform-root: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.terraform-root }}
          framework: terraform