name: Checkov Scan

on:
  workflow_call:
    inputs:
      scan-roots:
        description: JSON array of terraform roots to scan.
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:

  checkov:
    name: Checkov Scan ${{ matrix.scan-root }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scan-root: ${{ fromJson(inputs.scan-roots) }}

    defaults:
      run:
        working-directory: ${{ matrix.scan-root }}

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        # with:
        #   framework: terraform