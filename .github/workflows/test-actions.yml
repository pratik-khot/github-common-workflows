name: Test Composite Actions

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  changed-terraform-dirs:
    name: Test changed-terraform-dirs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Run local action
        uses: ./.github/actions/changed-terraform-dirs

      - name: Validate changed-directory output
        env:
          ACTUAL: ${{ steps.changed.outputs.dirs }}
          ACTUAL_HAS_CHANGES: ${{ steps.changed.outputs.has-changes }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            type == "array" and
            all(.[]; type == "string")
          ' <<< "$ACTUAL" >/dev/null

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] && \
              git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
              changed_files=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")
            elif git rev-parse --verify "${EVENT_SHA}^" >/dev/null 2>&1; then
              changed_files=$(git diff --name-only "${EVENT_SHA}^" "$EVENT_SHA")
            else
              changed_files=$(git show --format= --name-only "$EVENT_SHA")
            fi
          fi

          tf_files=$(printf '%s\n' "$changed_files" | grep -E '\.(tf|tfvars)$' | grep -v '^\.github/' || true)

          if [[ -z "$tf_files" ]]; then
            expected="[]"
            expected_has_changes="false"
          else
            expected=$(printf '%s\n' "$tf_files" \
              | xargs -r -n1 dirname \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            expected_has_changes="true"
          fi

          [[ "$ACTUAL" == "$expected" ]] || {
            echo "Expected dirs: $expected"
            echo "Actual dirs:   $ACTUAL"
            exit 1
          }
          [[ "$ACTUAL_HAS_CHANGES" == "$expected_has_changes" ]] || {
            echo "Expected has-changes: $expected_has_changes"
            echo "Actual has-changes:   $ACTUAL_HAS_CHANGES"
            exit 1
          }

  setup-terraform:
    name: Test setup-terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-terraform
        with:
          terraform-version: 1.9.8
      - name: Verify Terraform
        run: terraform version

  setup-terraform-auto-detect:
    name: Test setup-terraform version auto-detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create sample .terraform-version
        shell: bash
        run: |
          mkdir -p /tmp/tf-sample
          echo "1.9.8" > /tmp/tf-sample/.terraform-version
      - uses: ./.github/actions/setup-terraform
        with:
          working-directory: /tmp/tf-sample
      - name: Verify Terraform
        run: terraform version | grep -q "1.9.8"


  setup-kubectl:
    name: Test setup-kubectl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kubectl
        with:
          kubectl-version: v1.32.0
      - name: Verify kubectl
        run: kubectl version --client

  setup-helm:
    name: Test setup-helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-helm
        with:
          helm-version: v3.17.0
      - name: Verify Helm
        run: helm version