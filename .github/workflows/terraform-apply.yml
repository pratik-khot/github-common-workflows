name: Terraform Apply

on:
  workflow_call:
    inputs:
      root-path:
        description: Optional path prefix to restrict Terraform root detection to, for example myapp.
        required: false
        default: ""
        type: string
      environment:
        description: Protected GitHub Environment that authorizes this deployment.
        required: false
        default: ""
        type: string
      aws-region:
        description: AWS region for the assumed role.
        required: true
        type: string
      terraform-version:
        description: Terraform version to install. Leave empty to auto-detect from .terraform-version or required_version.
        required: false
        default: ""
        type: string
      terraform-roots:
        description: JSON array of terraform roots to apply.
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: AWS IAM role ARN trusted for GitHub OIDC.
        required: true
      TF_API_TOKEN:
        description: Optional Terraform Cloud API token.
        required: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply ${{ matrix.terraform-root }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        terraform-root: ${{ fromJson(inputs.terraform-roots) }}
    defaults:
      run:
        working-directory: ${{ matrix.terraform-root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-${{ github.run_id }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Initialize Terraform
        working-directory: ${{ matrix.terraform-root }}
        run: terraform init -input=false 
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Apply changes
        run: terraform apply -input=false -auto-approve 
