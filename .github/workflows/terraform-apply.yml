name: Terraform Apply

on:
  workflow_call:
    inputs:
      root-path:
        description: Optional path prefix to restrict Terraform root detection to, for example myapp.
        required: false
        default: ""
        type: string
      environment:
        description: Protected GitHub Environment that authorizes this deployment.
        required: false
        default: ""
        type: string
      aws-region:
        description: AWS region for the assumed role.
        required: true
        type: string
      terraform-version:
        description: Terraform version to install. Leave empty to auto-detect from .terraform-version or required_version.
        required: false
        default: ""
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: AWS IAM role ARN trusted for GitHub OIDC.
        required: true
      TF_API_TOKEN:
        description: Optional Terraform Cloud API token.
        required: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed Terraform roots
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.changed.outputs.dirs }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect changed Terraform directories
        uses: pratik-khot/github-common-workflows/.github/actions/changed-terraform-dirs@v1
        with:
          root-path: ${{ inputs.root-path }}

  apply:
    name: Apply ${{ matrix.terraform-root }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        terraform-root: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.terraform-root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-${{ github.run_id }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ matrix.terraform-root }}
          terraform-cloud-token: ${{ secrets.TF_API_TOKEN }}
      - name: Initialize Terraform
        working-directory: ${{ matrix.terraform-root }}
        run: terraform init -input=false 
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Apply changes
        run: terraform apply -input=false -auto-approve 
