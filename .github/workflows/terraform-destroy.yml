name: Terraform Destroy

on:
  workflow_call:
    inputs:
      terraform-root:
        description: Self-contained Terraform root to destroy, for example myapp/dev.
        required: true
        type: string
      environment:
        description: Protected GitHub Environment that authorizes this destroy.
        required: true
        type: string
      aws-region:
        description: AWS region for the assumed role.
        required: true
        type: string
      terraform-version:
        description: Terraform version to install. Leave empty to auto-detect from .terraform-version or required_version.
        required: false
        default: ""
        type: string
      backend-config:
        description: Newline-delimited terraform init backend-config values.
        required: false
        default: ""
        type: string
      terraform-args:
        description: Additional arguments passed to terraform destroy.
        required: false
        default: ""
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: AWS IAM role ARN trusted for GitHub OIDC.
        required: true
      TF_API_TOKEN:
        description: Optional Terraform Cloud API token.
        required: false

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy ${{ inputs.terraform-root }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.terraform-root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-${{ github.run_id }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_hostname: app.terraform.io
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Initialize Terraform
        shell: bash
        run: |
          init_args=()
          while IFS= read -r backend_config; do
            [ -z "$backend_config" ] || init_args+=("-backend-config=$backend_config")
          done <<'EOF'
          ${{ inputs.backend-config }}
          EOF
          terraform init -input=false "${init_args[@]}"
      - name: Destroy infrastructure
        run: terraform destroy -input=false -auto-approve ${{ inputs.terraform-args }}
